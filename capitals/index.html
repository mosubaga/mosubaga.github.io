<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotton Candy Theme</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="cc-container">
  <div class="cc-header">
    <span class="cc-badge">World Data</span>
    <h1>Countries &amp; Capitals</h1>
    <p>A quick reference table of countries and their capital cities.</p>
  </div>

  <div class="cc-card cc-card--blue">
    <div class="cc-table-wrap">
      <table class="cc-table" id="cc-table">
        <thead>
          <tr>
            <th>Country</th>
            <th>Capital</th>
          </tr>
        </thead>
        <tbody id="cc-table-body">
          <tr><td colspan="2">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="cc-footer">Data source: countrycapital.json</div>
</div>

<script>
  const tableBody = document.getElementById('cc-table-body');

  function renderTable(rows) {
    tableBody.innerHTML = '';
    const fragment = document.createDocumentFragment();
    rows.forEach(function (row) {
      const tr = document.createElement('tr');
      const countryCell = document.createElement('td');
      countryCell.textContent = row.country;
      const capitalCell = document.createElement('td');
      capitalCell.textContent = row.capital;
      tr.appendChild(countryCell);
      tr.appendChild(capitalCell);
      fragment.appendChild(tr);
    });
    tableBody.appendChild(fragment);
  }

  fetch('https://mosubaga.github.io/js/countrycapital.json')
    .then(function (response) { return response.json(); })
    .then(function (data) {
      const countries = data.sort(function (a, b) { return a.country.localeCompare(b.country); });
      renderTable(countries);
    })
    .catch(function (error) {
      tableBody.innerHTML = '<tr><td colspan="2">Failed to load data.</td></tr>';
      console.error('Error fetching country/capital data:', error);
    });
</script>

</body>
</html>
